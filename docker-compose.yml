services:
  postgres:
    image: postgres:16-alpine
    container_name: tutorbot-postgres
    environment:
      POSTGRES_USER: tutorbot
      POSTGRES_PASSWORD: tutorbot
      POSTGRES_DB: tutorbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorbot -d tutorbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: tutorbot-bot
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["python", "-m", "app.main"]

volumes:
  postgres_data:
